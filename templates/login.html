<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseAI — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  background: #050d1f;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(29,78,216,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29,78,216,0.08) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none;
}
.glow1 { position: fixed; top: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(29,78,216,0.25) 0%, transparent 70%); pointer-events: none; }
.glow2 { position: fixed; bottom: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%); pointer-events: none; }
.card { background: #071428; border: 1.5px solid rgba(96,165,250,0.3); border-radius: 20px; padding: 44px 40px; width: 420px; position: relative; z-index: 1; }
.card::before { content: ''; position: absolute; top: 0; left: 40px; right: 40px; height: 2px; background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, transparent); border-radius: 0 0 4px 4px; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
.logo-box { width: 40px; height: 40px; background: #1d4ed8; border: 1.5px solid #3b82f6; border-radius: 11px; display: grid; place-items: center; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 16px; color: #fff; }
.logo-text { font-size: 22px; font-weight: 700; color: #fff; }
.logo-text span { color: #60a5fa; }
h2 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: rgba(96,165,250,0.6); margin-bottom: 28px; font-family: 'Space Mono', monospace; }
.form-group { margin-bottom: 18px; }
label { display: block; font-size: 12px; font-weight: 600; color: rgba(96,165,250,0.8); margin-bottom: 7px; letter-spacing: 0.5px; }
input { width: 100%; padding: 12px 14px; background: #0a1d3d; border: 1.5px solid rgba(96,165,250,0.25); border-radius: 10px; color: #fff; font-family: 'Outfit', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
input::placeholder { color: rgba(255,255,255,0.2); }
input:focus { border-color: #3b82f6; }
.btn { width: 100%; padding: 13px; background: #1d4ed8; border: 1.5px solid #3b82f6; border-radius: 10px; color: #fff; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
.btn:hover { background: #2563eb; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
.divider { text-align: center; margin: 22px 0; position: relative; }
.divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(96,165,250,0.15); }
.divider span { background: #071428; padding: 0 12px; font-size: 12px; color: rgba(96,165,250,0.4); position: relative; font-family: 'Space Mono', monospace; }
.switch-link { text-align: center; font-size: 13px; color: rgba(255,255,255,0.4); }
.switch-link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="glow1"></div>
<div class="glow2"></div>
<div class="card">
  <div class="logo">
    <div class="logo-box">P</div>
    <div class="logo-text">Pulse<span>AI</span></div>
  </div>
  <h2>Welcome back</h2>
  <p class="subtitle">Sign in to your account</p>
  <div class="error-msg" id="errorMsg"></div>
  <div class="form-group">
    <label>EMAIL ADDRESS</label>
    <input type="email" id="email" placeholder="you@example.com" />
  </div>
  <div class="form-group">
    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="Enter your password" />
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
  <div class="divider"><span>OR</span></div>
  <div class="switch-link">Don't have an account? <a href="/register">Create one free</a></div>
</div>
<script>
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';
  if (!email || !password) { showError('Please fill in all fields'); return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res  = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (data.success) { window.location.href = '/chat'; }
    else { showError(data.error || 'Login failed'); btn.disabled = false; btn.textContent = 'Sign In'; }
  } catch(e) { showError('Network error.'); btn.disabled = false; btn.textContent = 'Sign In'; }
}
function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; }
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
